<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NovelVerse - เข้าสู่ระบบและยืนยันตัวตน (Login & Authentication)</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8ff; color: #1e1e24; }
	</style>
</head>
<body class="min-h-screen flex flex-col justify-between">
	<!-- Top Navigation Bar -->
	<header class="bg-white/80 backdrop-blur-md border-b border-indigo-50 px-6 py-4 flex items-center justify-between">
		<a href="#" class="flex items-center space-x-2">
			<span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">NovelVerse</span>
			<span class="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-full font-medium">เข้าสู่ระบบ</span>
		</a>
		<a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition">กลับสู่หน้าแรก</a>
	</header>

	<!-- Main Content -->
	<main class="flex-grow flex items-center justify-center px-6 py-12">
		<div class="bg-white border border-indigo-100 rounded-3xl shadow-xl max-w-md w-full p-8 space-y-6">
			<div class="text-center space-y-2">
				<h1 class="text-2xl font-extrabold text-gray-900">ยินดีต้อนรับกลับสู่ NovelVerse</h1>
				<p class="text-sm text-gray-500">เข้าสู่ระบบเพื่ออ่านนิยายและจัดการชั้นหนังสือของคุณ</p>
			</div>

			<div class="space-y-4">
				<div>
					<label class="block text-xs font-semibold text-gray-700 mb-1">อีเมล หรือ ชื่อผู้ใช้งาน</label>
					<input type="text" placeholder="example@novelverse.com" class="w-full bg-indigo-50/50 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-indigo-100">
				</div>
				<div>
					<label class="block text-xs font-semibold text-gray-700 mb-1">รหัสผ่าน</label>
					<input type="password" placeholder="••••••••" class="w-full bg-indigo-50/50 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-indigo-100">
				</div>
				<div class="flex items-center justify-between text-xs">
					<label class="flex items-center space-x-2 text-gray-600">
						<input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
						<span>จดจำฉันไว้ในระบบ</span>
					</label>
					<a href="#" class="text-indigo-600 hover:underline">ลืมรหัสผ่าน?</a>
				</div>
				<button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md">เข้าสู่ระบบ</button>
			</div>

			<div class="relative flex py-2 items-center">
				<div class="flex-grow border-t border-indigo-100"></div>
				<span class="flex-shrink mx-4 text-xs text-gray-400">หรือดำเนินการต่อด้วย</span>
				<div class="flex-grow border-t border-indigo-100"></div>
			</div>

			<div class="grid grid-cols-2 gap-3">
				<button class="border border-indigo-100 hover:bg-indigo-50/50 py-2.5 rounded-xl text-xs font-medium text-gray-700 transition flex items-center justify-center space-x-2">
					<span>Google</span>
				</button>
				<button class="border border-indigo-100 hover:bg-indigo-50/50 py-2.5 rounded-xl text-xs font-medium text-gray-700 transition flex items-center justify-center space-x-2">
					<span>Google Admin</span>
				</button>
			</div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="bg-white border-t border-indigo-50 py-8 px-6 text-center text-sm text-gray-500">
		<p>© 2025 NovelVerse Co., Ltd. แพลตฟอร์มนิยายออนไลน์อ่านฟรี 100%</p>
	</footer>
</body>
</html>
